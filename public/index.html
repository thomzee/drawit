<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
	<title>drawit — draw together, live</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
	<style>
		:root {
			--accent: #7c5cff;
			--bg: #0c0d13;
			--surface: #161822;
			--glass: rgba(18, 20, 30, 0.72);
			--hair: rgba(255, 255, 255, 0.08);
			--hair-strong: rgba(255, 255, 255, 0.14);
			--text: #eceef6;
			--muted: #8b90a6;
			--font-ui: 'Space Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
			--font-mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace;
			--safe-b: env(safe-area-inset-bottom, 0px);
		}

		* { box-sizing: border-box; }

		html, body {
			margin: 0;
			height: 100%;
			overflow: hidden;
			background:
				radial-gradient(1400px 700px at 50% -20%, rgba(124, 92, 255, 0.12), transparent 60%),
				var(--bg);
			color: var(--text);
			font-family: var(--font-ui);
			-webkit-font-smoothing: antialiased;
			touch-action: none;
			overscroll-behavior: none;
		}

		/* ---- Stage: one shared board, fitted + centered on every screen ---- */
		#stagewrap {
			position: fixed;
			top: calc(52px + env(safe-area-inset-top, 0px));
			left: 0;
			right: 0;
			bottom: calc(92px + env(safe-area-inset-bottom, 0px));
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 12px;
			z-index: 1;
		}

		#stage {
			position: relative;
			border-radius: 14px;
			overflow: hidden;
			background: var(--surface);
			box-shadow:
				0 30px 90px -30px rgba(0, 0, 0, 0.85),
				0 0 0 1px var(--hair-strong);
		}

		#stage canvas { display: block; position: absolute; inset: 0; }

		#cursors {
			position: absolute;
			inset: 0;
			pointer-events: none;
			z-index: 2;
		}

		/* ---- Header ---- */
		.hud {
			position: fixed;
			top: calc(14px + env(safe-area-inset-top, 0px));
			left: 16px;
			right: 16px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			pointer-events: none;
			z-index: 20;
		}

		.brand {
			display: flex;
			align-items: center;
			gap: 9px;
			font-weight: 700;
			font-size: 18px;
			letter-spacing: -0.02em;
			text-shadow: 0 1px 12px rgba(0, 0, 0, 0.5);
		}

		.brand .dot {
			width: 10px;
			height: 10px;
			border-radius: 50%;
			background: var(--accent);
			box-shadow: 0 0 14px 2px var(--accent);
		}

		.brand small {
			color: var(--muted);
			font-weight: 500;
			font-size: 12px;
		}

		.presence {
			display: flex;
			align-items: center;
			gap: 8px;
			font-family: var(--font-mono);
			font-size: 12px;
			color: var(--muted);
			background: var(--glass);
			backdrop-filter: blur(14px);
			-webkit-backdrop-filter: blur(14px);
			border: 1px solid var(--hair);
			padding: 7px 12px;
			border-radius: 999px;
			pointer-events: auto;
		}

		.presence b { color: var(--text); font-weight: 600; }

		.presence .live {
			width: 7px;
			height: 7px;
			border-radius: 50%;
			background: #35d07f;
			box-shadow: 0 0 10px #35d07f;
			animation: pulse 2s ease-in-out infinite;
		}

		@keyframes pulse { 50% { opacity: 0.35; } }

		.hint {
			position: fixed;
			top: 50%; left: 50%; transform: translate(-50%, -50%);
			font-family: var(--font-mono); font-size: 13px; color: var(--muted);
			opacity: .5; z-index: 5; pointer-events: none;
			transition: opacity .5s;
		}
		.hint.gone { opacity: 0; }

		/* ---- Bottom sheet ---- */
		.sheet {
			position: fixed;
			left: 50%;
			transform: translateX(-50%);
			bottom: calc(16px + var(--safe-b));
			width: min(760px, calc(100% - 20px));
			background: var(--glass);
			backdrop-filter: blur(22px) saturate(1.3);
			-webkit-backdrop-filter: blur(22px) saturate(1.3);
			border: 1px solid var(--hair-strong);
			border-radius: 20px;
			box-shadow: 0 24px 70px -22px rgba(0, 0, 0, 0.75);
			z-index: 20;
			overflow: hidden;
		}

		.sheet-handle {
			all: unset;
			box-sizing: border-box;
			display: flex;
			align-items: center;
			gap: 12px;
			width: 100%;
			padding: 11px 16px;
			cursor: pointer;
			border-bottom: 1px solid var(--hair);
		}
		.sheet-handle:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

		.sheet-handle .grip {
			width: 30px; height: 4px; border-radius: 999px;
			background: var(--hair-strong); flex: none;
		}

		.summary {
			display: flex; align-items: center; gap: 8px;
			flex: 1; min-width: 0;
			font-size: 13px; color: var(--muted);
		}
		.summary .sdot {
			width: 13px; height: 13px; border-radius: 50%;
			background: var(--accent);
			box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 80%, transparent);
			flex: none;
		}
		.summary b { color: var(--text); font-weight: 600; }

		.chev { color: var(--muted); font-size: 13px; transition: transform .25s ease; flex: none; }
		.sheet.collapsed .chev { transform: rotate(180deg); }

		.sheet-body {
			display: flex;
			align-items: center;
			gap: 8px;
			flex-wrap: wrap;
			justify-content: center;
			padding: 12px;
			max-height: 320px;
			overflow-y: auto;
			transition: max-height .28s ease, padding .28s ease, opacity .2s ease;
		}
		.sheet.collapsed .sheet-body {
			max-height: 0;
			padding-top: 0;
			padding-bottom: 0;
			opacity: 0;
			pointer-events: none;
		}

		.sep { width: 1px; align-self: stretch; background: var(--hair); margin: 2px; }

		.brushes { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }

		.brush {
			appearance: none;
			border: 1px solid transparent;
			background: transparent;
			color: var(--muted);
			font-family: var(--font-ui);
			font-size: 13px;
			font-weight: 500;
			padding: 8px 12px;
			border-radius: 11px;
			cursor: pointer;
			display: flex;
			align-items: center;
			gap: 7px;
			transition: color .15s, background .15s, border-color .15s;
		}
		.brush .swatch { width: 13px; height: 13px; border-radius: 4px; background: currentColor; opacity: .5; }
		.brush:hover { color: var(--text); background: rgba(255, 255, 255, 0.04); }
		.brush.active {
			color: var(--text);
			background: color-mix(in srgb, var(--accent) 20%, transparent);
			border-color: color-mix(in srgb, var(--accent) 55%, transparent);
		}
		.brush.active .swatch { opacity: 1; }

		.color {
			position: relative;
			width: 36px; height: 36px;
			border-radius: 10px;
			border: 2px solid var(--hair-strong);
			overflow: hidden;
			cursor: pointer;
			box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
			flex: none;
		}
		.color input { position: absolute; inset: -6px; width: 150%; height: 150%; border: 0; padding: 0; cursor: pointer; }

		.icon-btn {
			appearance: none;
			width: 36px; height: 36px;
			display: grid; place-items: center;
			border-radius: 10px;
			border: 1px solid var(--hair);
			background: rgba(255, 255, 255, 0.03);
			color: var(--muted);
			cursor: pointer;
			font-size: 15px;
			flex: none;
			transition: color .15s, background .15s, transform .1s;
		}
		.icon-btn:hover { color: var(--text); background: rgba(255, 255, 255, 0.07); }
		.icon-btn:active { transform: scale(0.92); }

		.swatches { display: flex; gap: 5px; }
		.chip {
			width: 20px; height: 20px; border-radius: 6px;
			border: 1px solid var(--hair-strong);
			cursor: pointer; padding: 0;
			transition: transform .1s;
		}
		.chip:hover { transform: scale(1.15); }

		.size { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
		.size .preview-wrap { width: 28px; display: grid; place-items: center; }
		.size .preview {
			border-radius: 50%;
			background: var(--accent);
			box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 70%, transparent);
		}
		#size {
			-webkit-appearance: none; appearance: none;
			width: 96px; height: 4px; border-radius: 999px;
			background: linear-gradient(90deg, var(--accent) var(--fill, 40%), var(--hair-strong) var(--fill, 40%));
			outline: none; cursor: pointer;
		}
		#size::-webkit-slider-thumb {
			-webkit-appearance: none; appearance: none;
			width: 16px; height: 16px; border-radius: 50%;
			background: #fff; border: 3px solid var(--accent);
			box-shadow: 0 2px 6px rgba(0,0,0,.4); cursor: pointer;
		}
		#size::-moz-range-thumb {
			width: 16px; height: 16px; border-radius: 50%;
			background: #fff; border: 3px solid var(--accent); cursor: pointer;
		}
		.sizeval { font-family: var(--font-mono); font-size: 12px; color: var(--muted); width: 20px; text-align: right; }

		.text-btn {
			appearance: none;
			border: 1px solid var(--hair);
			background: rgba(255,255,255,0.03);
			color: var(--muted);
			font-family: var(--font-ui); font-size: 13px; font-weight: 500;
			padding: 8px 13px; border-radius: 11px; cursor: pointer;
			flex: none;
			transition: color .15s, background .15s, border-color .15s;
		}
		.text-btn:hover { color: var(--text); background: rgba(255,255,255,0.07); }
		.text-btn.danger:hover { color: #ff7a90; border-color: rgba(255,122,144,.4); background: rgba(255,122,144,.08); }

		@media (max-width: 680px) {
			.sheet {
				left: 0; right: 0; bottom: 0; width: 100%;
				transform: none;
				border-radius: 18px 18px 0 0;
				border-left: none; border-right: none; border-bottom: none;
				padding-bottom: var(--safe-b);
			}
			.brand small { display: none; }
		}
	</style>
</head>

<body>
	<div id="stagewrap">
		<div id="stage">
			<canvas id="cursors"></canvas>
		</div>
	</div>

	<div class="hud">
		<div class="brand">
			<span class="dot"></span>
			drawit <small>· draw together, live</small>
		</div>
		<div class="presence">
			<span class="live"></span> <b id="count">1</b> online
		</div>
	</div>

	<div class="hint" id="hint">draw anywhere · pull the sheet down to hide tools</div>

	<div class="sheet" id="sheet">
		<button class="sheet-handle" id="sheetToggle" aria-expanded="true" aria-label="Toggle tools">
			<span class="grip"></span>
			<span class="summary">
				<span class="sdot" id="summaryDot"></span>
				<span><b id="summaryBrush">Pen</b> · <span id="summarySize">8</span>px</span>
			</span>
			<span class="chev">▾</span>
		</button>

		<div class="sheet-body" id="sheetBody">
			<div class="brushes" id="brushes">
				<button class="brush active" data-brush="pen"><span class="swatch"></span>Pen</button>
				<button class="brush" data-brush="marker"><span class="swatch"></span>Marker</button>
				<button class="brush" data-brush="neon"><span class="swatch"></span>Neon</button>
				<button class="brush" data-brush="spray"><span class="swatch"></span>Spray</button>
				<button class="brush" data-brush="rainbow"><span class="swatch"></span>Rainbow</button>
				<button class="brush" data-brush="eraser"><span class="swatch"></span>Eraser</button>
			</div>

			<div class="sep"></div>

			<label class="color" title="Pick a color">
				<input type="color" id="color" value="#7c5cff" />
			</label>
			<button class="icon-btn" id="dice" title="Random color">🎲</button>
			<div class="swatches" id="swatches"></div>

			<div class="sep"></div>

			<div class="size">
				<div class="preview-wrap"><span class="preview" id="preview"></span></div>
				<input type="range" id="size" min="1" max="64" value="8" />
				<span class="sizeval" id="sizeval">8</span>
			</div>

			<div class="sep"></div>

			<button class="text-btn" id="save" title="Download PNG">Save</button>
			<button class="text-btn danger" id="clear" title="Clear the board for everyone">Clear</button>
		</div>
	</div>

	<script src="libraries/p5/p5.min.js"></script>
	<script src="/socket.io/socket.io.js"></script>
	<script src="sketch.js"></script>
</body>

</html>
