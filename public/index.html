<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
	<title>drawit — draw together, live</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
	<style>
		:root {
			--accent: #7c5cff;
			--bg: #0c0d13;
			--surface: #161822;
			--glass: rgba(20, 22, 32, 0.66);
			--hair: rgba(255, 255, 255, 0.08);
			--hair-strong: rgba(255, 255, 255, 0.14);
			--text: #eceef6;
			--muted: #8b90a6;
			--font-ui: 'Space Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
			--font-mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace;
		}

		* { box-sizing: border-box; }

		html, body {
			margin: 0;
			height: 100%;
			overflow: hidden;
			background:
				radial-gradient(1200px 600px at 50% -10%, rgba(124, 92, 255, 0.10), transparent 60%),
				var(--bg);
			color: var(--text);
			font-family: var(--font-ui);
			-webkit-font-smoothing: antialiased;
			touch-action: none;
		}

		/* ---- Stage: the artboard, centered ---- */
		#center {
			position: fixed;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			padding-bottom: 96px;
		}

		#stage {
			position: relative;
			border-radius: 16px;
			overflow: hidden;
			box-shadow:
				0 40px 120px -30px rgba(0, 0, 0, 0.8),
				0 0 0 1px var(--hair) inset;
		}

		#stage canvas { display: block; }

		#cursors {
			position: absolute;
			inset: 0;
			pointer-events: none;
		}

		/* ---- Header ---- */
		.hud {
			position: fixed;
			top: 18px;
			left: 22px;
			right: 22px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			pointer-events: none;
			z-index: 10;
		}

		.brand {
			display: flex;
			align-items: center;
			gap: 10px;
			font-weight: 700;
			font-size: 19px;
			letter-spacing: -0.02em;
		}

		.brand .dot {
			width: 11px;
			height: 11px;
			border-radius: 50%;
			background: var(--accent);
			box-shadow: 0 0 14px 2px var(--accent);
		}

		.brand small {
			color: var(--muted);
			font-weight: 500;
			font-size: 12px;
			letter-spacing: 0.01em;
		}

		.presence {
			display: flex;
			align-items: center;
			gap: 8px;
			font-family: var(--font-mono);
			font-size: 12px;
			color: var(--muted);
			background: var(--glass);
			backdrop-filter: blur(14px);
			-webkit-backdrop-filter: blur(14px);
			border: 1px solid var(--hair);
			padding: 7px 12px;
			border-radius: 999px;
			pointer-events: auto;
		}

		.presence b { color: var(--text); font-weight: 600; }

		.presence .live {
			width: 7px;
			height: 7px;
			border-radius: 50%;
			background: #35d07f;
			box-shadow: 0 0 10px #35d07f;
			animation: pulse 2s ease-in-out infinite;
		}

		@keyframes pulse { 50% { opacity: 0.35; } }

		/* ---- Toolbar ---- */
		.toolbar {
			position: fixed;
			bottom: 20px;
			left: 50%;
			transform: translateX(-50%);
			display: flex;
			align-items: center;
			gap: 8px;
			padding: 9px;
			max-width: calc(100vw - 24px);
			flex-wrap: wrap;
			justify-content: center;
			background: var(--glass);
			backdrop-filter: blur(20px) saturate(1.3);
			-webkit-backdrop-filter: blur(20px) saturate(1.3);
			border: 1px solid var(--hair-strong);
			border-radius: 18px;
			box-shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.7);
			z-index: 10;
		}

		.sep { width: 1px; align-self: stretch; background: var(--hair); margin: 2px 2px; }

		.brushes { display: flex; gap: 4px; }

		.brush {
			appearance: none;
			border: 1px solid transparent;
			background: transparent;
			color: var(--muted);
			font-family: var(--font-ui);
			font-size: 13px;
			font-weight: 500;
			padding: 8px 12px;
			border-radius: 11px;
			cursor: pointer;
			display: flex;
			align-items: center;
			gap: 7px;
			transition: color .15s, background .15s, border-color .15s;
		}

		.brush .swatch {
			width: 14px; height: 14px; border-radius: 4px;
			background: currentColor; opacity: .55;
		}

		.brush:hover { color: var(--text); background: rgba(255, 255, 255, 0.04); }

		.brush.active {
			color: var(--text);
			background: color-mix(in srgb, var(--accent) 20%, transparent);
			border-color: color-mix(in srgb, var(--accent) 55%, transparent);
		}
		.brush.active .swatch { opacity: 1; }

		/* Color control */
		.color {
			position: relative;
			width: 36px; height: 36px;
			border-radius: 10px;
			border: 2px solid var(--hair-strong);
			overflow: hidden;
			cursor: pointer;
			box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
		}
		.color input { position: absolute; inset: -6px; width: 150%; height: 150%; border: 0; padding: 0; cursor: pointer; }

		.icon-btn {
			appearance: none;
			width: 36px; height: 36px;
			display: grid; place-items: center;
			border-radius: 10px;
			border: 1px solid var(--hair);
			background: rgba(255, 255, 255, 0.03);
			color: var(--muted);
			cursor: pointer;
			font-size: 15px;
			transition: color .15s, background .15s, transform .1s;
		}
		.icon-btn:hover { color: var(--text); background: rgba(255, 255, 255, 0.07); }
		.icon-btn:active { transform: scale(0.92); }

		.swatches { display: flex; gap: 5px; }
		.chip {
			width: 20px; height: 20px; border-radius: 6px;
			border: 1px solid var(--hair-strong);
			cursor: pointer; padding: 0;
			transition: transform .1s;
		}
		.chip:hover { transform: scale(1.15); }

		/* Size */
		.size { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
		.size .preview-wrap { width: 28px; display: grid; place-items: center; }
		.size .preview {
			border-radius: 50%;
			background: var(--accent);
			box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 70%, transparent);
		}
		#size {
			-webkit-appearance: none; appearance: none;
			width: 96px; height: 4px; border-radius: 999px;
			background: linear-gradient(90deg, var(--accent) var(--fill, 40%), var(--hair-strong) var(--fill, 40%));
			outline: none; cursor: pointer;
		}
		#size::-webkit-slider-thumb {
			-webkit-appearance: none; appearance: none;
			width: 16px; height: 16px; border-radius: 50%;
			background: #fff; border: 3px solid var(--accent);
			box-shadow: 0 2px 6px rgba(0,0,0,.4); cursor: pointer;
		}
		#size::-moz-range-thumb {
			width: 16px; height: 16px; border-radius: 50%;
			background: #fff; border: 3px solid var(--accent); cursor: pointer;
		}
		.sizeval { font-family: var(--font-mono); font-size: 12px; color: var(--muted); width: 20px; text-align: right; }

		.text-btn {
			appearance: none;
			border: 1px solid var(--hair);
			background: rgba(255,255,255,0.03);
			color: var(--muted);
			font-family: var(--font-ui); font-size: 13px; font-weight: 500;
			padding: 8px 13px; border-radius: 11px; cursor: pointer;
			transition: color .15s, background .15s, border-color .15s;
		}
		.text-btn:hover { color: var(--text); background: rgba(255,255,255,0.07); }
		.text-btn.danger:hover { color: #ff7a90; border-color: rgba(255,122,144,.4); background: rgba(255,122,144,.08); }

		.hint {
			position: fixed;
			bottom: 84px; left: 50%; transform: translateX(-50%);
			font-family: var(--font-mono); font-size: 11px; color: var(--muted);
			opacity: .6; z-index: 9; pointer-events: none;
			transition: opacity .5s;
		}
		.hint.gone { opacity: 0; }

		@media (max-width: 640px) {
			.brush { padding: 8px 9px; font-size: 12px; }
			.brush .swatch { display: none; }
			.swatches { display: none; }
			.hud { top: 12px; left: 14px; right: 14px; }
		}
	</style>
</head>

<body>
	<div id="center">
		<div id="stage">
			<canvas id="cursors"></canvas>
		</div>
	</div>

	<div class="hud">
		<div class="brand">
			<span class="dot"></span>
			drawit <small>· draw together, live</small>
		</div>
		<div class="presence">
			<span class="live"></span> <b id="count">1</b> online
		</div>
	</div>

	<div class="hint" id="hint">click &amp; drag on the board to draw</div>

	<div class="toolbar">
		<div class="brushes" id="brushes">
			<button class="brush active" data-brush="pen"><span class="swatch"></span>Pen</button>
			<button class="brush" data-brush="marker"><span class="swatch"></span>Marker</button>
			<button class="brush" data-brush="neon"><span class="swatch"></span>Neon</button>
			<button class="brush" data-brush="spray"><span class="swatch"></span>Spray</button>
			<button class="brush" data-brush="rainbow"><span class="swatch"></span>Rainbow</button>
			<button class="brush" data-brush="eraser"><span class="swatch"></span>Eraser</button>
		</div>

		<div class="sep"></div>

		<label class="color" title="Pick a color">
			<input type="color" id="color" value="#7c5cff" />
		</label>
		<button class="icon-btn" id="dice" title="Random color">🎲</button>
		<div class="swatches" id="swatches"></div>

		<div class="sep"></div>

		<div class="size">
			<div class="preview-wrap"><span class="preview" id="preview"></span></div>
			<input type="range" id="size" min="1" max="64" value="8" />
			<span class="sizeval" id="sizeval">8</span>
		</div>

		<div class="sep"></div>

		<button class="text-btn" id="save" title="Download PNG">Save</button>
		<button class="text-btn danger" id="clear" title="Clear the board for everyone">Clear</button>
	</div>

	<script src="libraries/p5/p5.min.js"></script>
	<script src="/socket.io/socket.io.js"></script>
	<script src="sketch.js"></script>
</body>

</html>
